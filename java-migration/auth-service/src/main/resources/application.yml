server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USER:athiel}
    password: ${DB_PASSWORD:athiel}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

athiel:
  jwt:
    secret: ${JWT_SECRET_KEY}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
