server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/login,/me
        - id: orders
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/create_preference,/settings,/payments/manual,/reports/**,/boxes/**
        - id: payments
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/webhook,/success,/failure,/pending
        # OpenAPI specs of the public services, aggregated in Swagger UI
        # (/swagger-ui.html). PreserveHostHeader makes the spec's "servers"
        # point at the gateway instead of the internal service.
        - id: docs-auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/docs/auth/**
          filters:
            - PreserveHostHeader
        - id: docs-order
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/docs/order/**
          filters:
            - PreserveHostHeader
        - id: docs-payment
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/docs/payment/**
          filters:
            - PreserveHostHeader
        # device-service has no route on purpose: only order-service reaches it.

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /docs/auth/v3/api-docs
      - name: order-service
        url: /docs/order/v3/api-docs
      - name: payment-service
        url: /docs/payment/v3/api-docs

athiel:
  gateway:
    jwt-secret: ${JWT_SECRET_KEY}
    # The Python routes that used Depends(get_current_user), plus the box stop
    # command, which was open to anyone in the Python version.
    protected-routes:
      - GET /me
      - GET /settings
      - PUT /settings
      - POST /payments/manual
      - GET /reports/**
      - POST /boxes/**
